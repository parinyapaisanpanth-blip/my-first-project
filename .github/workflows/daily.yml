name: daily-news

on:
  schedule:
    - cron: '0 23 * * *'   # 06:00 Asia/Bangkok (UTC+7)
  workflow_dispatch:
    inputs:
      force_buy:
        description: 'Force DCA buy regardless of day (for testing)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  scout-news:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run scout-news
        run: node scripts/scout-news.mjs
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run dca-pilot
        run: node scripts/dca-pilot.mjs
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FORCE_BUY: ${{ github.event.inputs.force_buy }}

      - name: Run render-showcase
        run: node scripts/render-showcase.mjs

      - name: Commit and push news digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add knowledge/news knowledge/INDEX.md portfolio/state.json portfolio/history.json portfolio/conviction.json showcase/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(news): daily digest $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi
